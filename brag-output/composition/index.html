<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Markoby Launch Video</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07080a;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07080a;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-no-timeline
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <!-- Audio Tracks -->
      <audio
        id="bg-music"
        data-start="0"
        data-duration="20"
        data-volume="0.35"
        data-fade-out="0.8"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"
      ></audio>

      <audio
        id="sfx-hero"
        data-start="0.2"
        data-duration="0.12"
        data-volume="0.65"
        src="assets/sfx/impact/impactSoft_medium_000.ogg"
      ></audio>
      <audio
        id="sfx-click1"
        data-start="4.6"
        data-duration="0.10"
        data-volume="0.6"
        src="assets/sfx/interface/click_001.ogg"
      ></audio>
      <audio
        id="sfx-drop1"
        data-start="6.0"
        data-duration="0.11"
        data-volume="0.55"
        src="assets/sfx/interface/drop_001.ogg"
      ></audio>
      <audio
        id="sfx-card1"
        data-start="8.74"
        data-duration="0.60"
        data-volume="0.65"
        src="assets/sfx/casino/card-slide-1.ogg"
      ></audio>
      <audio
        id="sfx-outcome"
        data-start="13.11"
        data-duration="0.26"
        data-volume="0.65"
        src="assets/sfx/casino/chips-collide-1.ogg"
      ></audio>
      <audio
        id="sfx-logo"
        data-start="17.47"
        data-duration="1.48"
        data-volume="0.75"
        src="assets/sfx/impact/impactBell_heavy_000.ogg"
      ></audio>

      <!-- Sub-Compositions -->
      <div
        id="mount-scene-1"
        class="clip"
        data-composition-id="scene-1"
        data-composition-src="compositions/scene-1.html"
        data-start="0"
        data-duration="4.2"
      ></div>

      <div
        id="mount-scene-2"
        class="clip"
        data-composition-id="scene-2"
        data-composition-src="compositions/scene-2.html"
        data-start="4.2"
        data-duration="4.4"
      ></div>

      <div
        id="mount-scene-3"
        class="clip"
        data-composition-id="scene-3"
        data-composition-src="compositions/scene-3.html"
        data-start="8.6"
        data-duration="4.4"
      ></div>

      <div
        id="mount-scene-4"
        class="clip"
        data-composition-id="scene-4"
        data-composition-src="compositions/scene-4.html"
        data-start="13"
        data-duration="4.2"
      ></div>

      <div
        id="mount-scene-5"
        class="clip"
        data-composition-id="scene-5"
        data-composition-src="compositions/scene-5.html"
        data-start="17.2"
        data-duration="2.8"
      ></div>
    </div>
  </body>
</html>
