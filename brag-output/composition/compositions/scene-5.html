<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700;1,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07080a;
        color: #ffffff;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      #scene-5 {
        position: relative;
        width: 1920px;
        height: 1080px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07080a;
        overflow: hidden;
      }
      .ambient-glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle 800px at 50% 50%, rgba(163, 243, 36, 0.12), transparent 70%);
      }
      .grid-overlay {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 80px 80px;
        opacity: 0.8;
      }
      .logo-wrap {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform-origin: center center;
      }
      .logo-emblem {
        width: 120px;
        height: 120px;
        background: #a3f324;
        border-radius: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 70px;
        font-weight: 900;
        color: #07080a;
        box-shadow: 0 0 70px rgba(163, 243, 36, 0.65);
        margin-bottom: 24px;
      }
      .brand-title {
        font-size: 88px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #ffffff;
        margin-bottom: 12px;
      }
      .brand-tagline {
        font-size: 28px;
        color: #d4d4d8;
        max-width: 850px;
        line-height: 1.45;
        margin-bottom: 38px;
      }
      .cta-button {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        background: #a3f324;
        color: #07080a;
        font-weight: 800;
        font-size: 20px;
        padding: 20px 48px;
        border-radius: 9999px;
        border: none;
        box-shadow: 0 0 45px rgba(163, 243, 36, 0.5);
      }
      .sub-cta-note {
        font-size: 16px;
        color: #a1a1aa;
        margin-top: 18px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="scene-5" data-composition-id="scene-5" data-width="1920" data-height="1080">
      <div class="ambient-glow"></div>
      <div class="grid-overlay"></div>

      <div class="logo-wrap" id="s5-content">
        <div class="logo-emblem" id="s5-emblem">M</div>
        <h1 class="brand-title" id="s5-title">Markoby</h1>
        <p class="brand-tagline" id="s5-tagline">
          Your AI growth marketer for the zero-ad-budget era.
        </p>
        <div class="cta-button" id="s5-cta">
          <span>Start With Your First Project Free</span>
          <span style="font-size: 24px;">→</span>
        </div>
        <div class="sub-cta-note" id="s5-note">
          First project free · No credit card required · ₹299/month after
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Slam logo in at start of scene (beat-locked: 0.27s from scene start = 17.47s global)
      tl.fromTo("#s5-emblem", { scale: 0, rotation: -15, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.5)" }, 0.2);
      tl.fromTo("#s5-title", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.5);
      tl.fromTo("#s5-tagline", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.7);
      tl.fromTo("#s5-cta", { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 0.95);
      tl.fromTo("#s5-note", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 1.2);

      // Subtle slow outward push
      tl.fromTo("#s5-content", { scale: 0.98 }, { scale: 1.02, duration: 2.8, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-5"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
